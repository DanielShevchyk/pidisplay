# PiDisplay: prefer the screen's HDMI speakers over the 3.5mm jack (WirePlumber 0.5+).
# Same rule as 51-pidisplay-hdmi.lua, which older WirePlumber (Bookworm) reads instead.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
    actions = { update-props = { priority.session = 2000, priority.driver = 2000 } }
  }
]
